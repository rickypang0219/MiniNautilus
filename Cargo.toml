[package]
name = "mininautilus"
version = "0.1.0"
edition = "2024"
description = "A deterministic trading systems learning laboratory"
license = "MIT"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bench]]
name = "latency"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

