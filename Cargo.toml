[package]
name = "mininautilus"
version = "0.1.0"
edition = "2024"
default-run = "mininautilus"
description = "A deterministic trading systems learning laboratory"
license = "MIT"

[features]
fault-injection = []
native-runtime = ["dep:crossbeam-channel", "dep:reqwest", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:rust_decimal", "dep:k256", "dep:sha3", "dep:sha2", "dep:rmp-serde", "dep:hex", "dep:native-tls"]

[[bin]]
name = "native-live"
path = "src/bin/native_live.rs"
required-features = ["native-runtime"]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = { version = "0.5", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal"], optional = true }
tokio-tungstenite = { version = "0.28", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
rust_decimal = { version = "1", optional = true }
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
sha3 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
rmp-serde = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
native-tls = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bench]]
name = "latency"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"


[profile.release]
# Whole-program inlining across the library/binary boundary (Core::apply's
# header-only path runs ~10M times per 5-year backtest).
lto = "fat"
codegen-units = 1
