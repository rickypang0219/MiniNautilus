name: Reliability tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dashboard_time.cjs
      - run: python -m pip install -r requirements.txt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python ops/runtime_bench.py --build
      - run: cargo build --locked --release --example compare_engine
      - run: python comparisons/run.py --platforms mini --seeds 20 --output runs/ci-comparison
      - name: Python tests
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(
              ['python', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_*.py'],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout, end='')
          if result.returncode:
              tail = result.stdout[-16000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Python test failure::' + tail)
          raise SystemExit(result.returncode)
          PY
